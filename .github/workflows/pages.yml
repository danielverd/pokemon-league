# Rebuild the dashboard from the stat sheet on every push and publish it to GitHub Pages.
# Public build only: no display names are ever passed in, so the page shows initials.
name: Build and deploy dashboard

on:
  push:
    branches: [main]
    paths: [PokemonLeague_statsheet.tsv, build.py, template.html, requirements.txt, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build public page
        env:
          PDL_NAMES: ""  # explicit: the public build never gets names
        run: |
          python build.py
          test -f index.html && test ! -f index.private.html
          mkdir _site && cp index.html _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
